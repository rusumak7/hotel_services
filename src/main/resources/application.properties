spring.application.name=Hotel Services
com.spring_lessons.hotel_services.version=${PROJECT_VERSION:0.0.1}

# DB settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_services
spring.datasource.username=user
spring.datasource.password=user
spring.jpa.hibernate.ddl-auto=create
# none \u043D\u0435 \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0442\u044C \u043D\u0438\u043A\u0430\u043A\u0438\u0445 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439
# create \u0443\u0434\u0430\u043B\u044F\u0442\u044C \u0438 \u0437\u0430\u043D\u043E\u0432\u043E \u0441\u043E\u0437\u0434\u0430\u0432\u0430\u0442\u044C \u0442\u0430\u0431\u043B\u0438\u0446\u044B \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 entity \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u043C \u0437\u0430\u043F\u0443\u0441\u043A\u0435
# create-drop \u0441\u043E\u0437\u0434\u0430\u0442\u044C \u0442\u0430\u0431\u043B\u0438\u0446\u044B \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 entity \u043F\u0440\u0438 \u0437\u0430\u043F\u0443\u0441\u043A\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F, \u0443\u0434\u0430\u043B\u0438\u0442\u044C \u043F\u0440\u0438 \u0437\u0430\u043A\u0440\u044B\u0442\u0438\u0438 \u043A\u043E\u043D\u0442\u0435\u043A\u0441\u0442\u0430 (\u043F\u043E\u0434\u0445\u043E\u0434\u0438\u0442 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432)
# validate \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u044F \u0411\u0414 \u0438 entity, \u0435\u0441\u043B\u0438 \u043E\u043D\u0438 \u043D\u0435 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u044E\u0442 \u0434\u0440\u0443\u0433 \u0434\u0440\u0443\u0433\u0443, \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u043D\u0435 \u0437\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u0441\u044F

# \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u0442\u044C SQL \u0437\u0430\u043F\u0440\u043E\u0441\u044B
spring.jpa.show-sql=true

# \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435 sql \u0438\u0437 \u0444\u0430\u0439\u043B\u0430
spring.sql.init.mode=never
# always - \u0432\u0441\u0435\u0433\u0434\u0430. # spring boot \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D \u043D\u0430 \u043F\u043E\u0438\u0441\u043A \u0444\u0430\u0439\u043B\u043E\u0432
# schema.sql \u0434\u043B\u044F \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044F \u0442\u0430\u0431\u043B\u0438\u0446 \u0438/\u0438\u043B\u0438 data.sql \u0434\u043B\u044F \u043D\u0430\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F \u0442\u0430\u0431\u043B\u0438\u0446.
# \u0424\u0430\u0439\u043B\u044B \u0434\u043E\u043B\u0436\u043D\u044B \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u044C\u0441\u044F \u0432 \u043F\u0430\u043A\u0435 resources
# never - \u043D\u0438\u043A\u043E\u0433\u0434\u0430
# embedded -\u0434\u043B\u044F \u0432\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0445 \u0411\u0414

# \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0442\u044C \u0441\u043A\u0440\u0438\u043F\u0442\u044B \u0438\u0437 sql \u0444\u0430\u0439\u043B\u0430 \u043F\u043E\u0441\u043B\u0435 \u0442\u043E\u0433\u043E, \u043A\u0430\u043A \u043E\u0442\u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 hibernate
spring.jpa.defer-datasource-initialization=false
